theory:
  coupled_axion_theory.CoupledAxionClassy:
    path: /home/imagination/axiclass/AxiCLASS_mod/AxiCLASS
    speed: 0.2
    stop_at_error: false
    extra_args:
      scf_potential: axion
      n_axion: 1.0
      attractor_ic_scf: 'no'
      do_shooting_scf: 'yes'
      scf_evolve_as_fluid: 'no'
      scf_evolve_like_axionCAMB: 'no'
      scf_has_perturbations: 'yes'
      use_big_theta_scf: 'no'
      use_delta_scf_over_1plusw: 'no'
      include_scf_in_delta_m: 'no'
      loop_over_background_for_closure_relation: 'yes'
      lensing: 'yes'
      precision_loop_over_background: 0.01
      DMDE_interaction: 0
      evolver: 0
      gauge: synchronous
      background_verbose: 0
      input_verbose: 0
      output_verbose: 1
      non_linear: halofit
      Omega_cdm: 0
    ignore_obsolete: true
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
    version: v3.3.0
    python_path: /home/imagination/axiclass/yamlfiles
    input_params:
    - H0
    - omega_b
    - n_s
    - A_s
    - tau_reio
    - Omega_c
    - beta_axion
    - log_mphi_H0
    - delta_i
    output_params:
    - f_axion
