params:
  H0:
    prior:
      min: 50
      max: 80
    ref: 67.5
    proposal: 1
    latex: H_0
  omega_b:
    prior:
      min: 0.018
      max: 0.026
    ref: 0.02237
    proposal: 0.0001
    latex: \omega_b
    renames:
    - omegabh2
  n_s:
    prior:
      min: 0.8
      max: 1.2
    ref: 0.9649
    proposal: 0.004
    latex: n_s
    renames:
    - ns
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.044
    proposal: 0.01
    latex: \log(10^{10}A_s)
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_s
    derived: true
    renames:
    - As
  tau_reio:
    prior:
      min: 0.01
      max: 0.12
    ref: 0.0544
    proposal: 0.005
    latex: \tau_{\rm reio}
    renames:
    - tau
  Omega_c:
    prior:
      min: 0.2
      max: 0.4
    ref: 0.3046
    proposal: 0.005
    latex: \Omega_c
  beta_axion:
    prior:
      min: 0
      max: 0.15
    ref: 0.077
    proposal: 0.005
    latex: \beta
  log_mphi_H0:
    prior:
      min: -1.5
      max: 0.35
    ref: -0.346
    proposal: 0.05
    latex: \log(m_\phi/H_0)
  delta_i:
    prior:
      min: 0.01
      max: 1.57
    ref: 0.839
    proposal: 0.05
    latex: \delta_i
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
  chi2__SN:
    latex: \chi^2_\mathrm{SN}
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 0
    max_tries: 1000
    covmat: null
    covmat_params: null
    proposal_scale: 2.4
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - H0
        - omega_b
        - n_s
        - logA
        - tau_reio
        - Omega_c
        - beta_axion
        - log_mphi_H0
        - delta_i
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.6.2
